# Published-image deployment. This file does not replace compose.yaml.
# Its project name is separate so it cannot replace the current Pi stack.
# Set FAMILY_HUB_VERSION to an immutable tag before use.
name: family-hub-published
services:
  family-hub:
    image: ghcr.io/3d6564/family-hub:${FAMILY_HUB_VERSION:?Set FAMILY_HUB_VERSION}
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_PATH: /data/family-hub.sqlite
      TZ: ${TZ:-UTC}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3000}
      HOUSEHOLD_NAME: ${HOUSEHOLD_NAME:-Our Home}
      SESSION_DAYS: ${SESSION_DAYS:-30}
    ports:
      # Loopback is the default. For a private-LAN proxy on another machine,
      # set FAMILY_HUB_PUBLISH to that host's private address, such as
      # 192.168.1.20:3000. Do not publish port 3000 to the internet.
      - ${FAMILY_HUB_PUBLISH:-127.0.0.1:3000}:3000
    volumes:
      - family-hub-data:/data
volumes:
  family-hub-data:
