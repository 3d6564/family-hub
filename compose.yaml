services:
  family-hub:
    image: ghcr.io/3d6564/family-hub:${FAMILY_HUB_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_PATH: /data/family-hub.sqlite
      TZ: ${TZ:-America/Chicago}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3000}
      HOUSEHOLD_NAME: ${HOUSEHOLD_NAME:-Our Home}
      SESSION_DAYS: ${SESSION_DAYS:-30}
    ports:
      - ${FAMILY_HUB_PUBLISH:-3000}:3000
    volumes:
      - family-hub-data:/data
volumes:
  family-hub-data:
